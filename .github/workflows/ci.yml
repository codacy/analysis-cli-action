name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  # Runs the action from this checkout against its own fixture, without a token
  # (config-source falls back to discover), on every OS the CLI supports.
  smoke:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run the action
        id: codacy
        uses: ./
        with:
          path: smoke-test
          tool: shellcheck

      - name: Check the outputs
        shell: bash
        env:
          REPORT: ${{ steps.codacy.outputs.report }}
          ISSUES: ${{ steps.codacy.outputs.issues }}
        run: |
          test -f "$REPORT" || { echo "::error::no report at '$REPORT'"; exit 1; }
          [ "$ISSUES" -ge 1 ] || { echo "::error::expected issues in the fixture, got '$ISSUES'"; exit 1; }
          echo "Report $REPORT has $ISSUES issue(s)"

  # The documented flow end to end: this repository is itself on Codacy, with
  # "Run analysis through build server" on, so the action fetches its Codacy
  # configuration with the project token and uploads the results for the
  # commit. Everything involved is public. Pull requests from forks get no
  # secrets, and neither do Dependabot's, although its branches live in this
  # repository, so the job runs only for this repository's own branches and
  # never for Dependabot.
  integration:
    name: Codacy integration (project token)
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the results are uploaded for, not the PR merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run the action
        id: codacy
        uses: ./
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          config-source: remote
          upload: true

      # Asserts one known finding rather than "at least one issue": the tools
      # and patterns come from Codacy (config-source: remote), so the total is
      # not this repository's to fix, while SC2086 on smoke-test/sample.sh is
      # deterministic for as long as ShellCheck is enabled there. Without it the
      # job could pass having analyzed and uploaded nothing.
      - name: Check the outputs
        env:
          REPORT: ${{ steps.codacy.outputs.report }}
          ISSUES: ${{ steps.codacy.outputs.issues }}
        run: |
          test -f "$REPORT" || { echo "::error::no report at '$REPORT'"; exit 1; }
          found="$(jq '[.runs[].results[]
            | select(.ruleId == "shellcheck_SC2086"
                and .locations[0].physicalLocation.artifactLocation.uri == "smoke-test/sample.sh")]
            | length' "$REPORT")"
          if [ "$found" -lt 1 ]; then
            echo "::error::ShellCheck SC2086 on smoke-test/sample.sh is missing from $REPORT. Either the analysis did not run, or ShellCheck (or that pattern) was disabled for this repository on Codacy."
            exit 1
          fi
          echo "Uploaded $ISSUES issue(s) from $REPORT, including the smoke-test finding"
